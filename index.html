  <!-- All text, links and image paths come from content.js. Edit that file, not this one. -->
  <script src="content.js"></script>
  <script>
    // Preload the hero photo named in content.js so it shows up fast.
    (function () {
      var h = (window.CONTENT || {}).hero || {};
      var src = h.webp || h.image;
      if (!src) return;
      var l = document.createElement("link");
      l.rel = "preload"; l.as = "image"; l.href = src; l.fetchPriority = "high";
      if (h.webp) l.type = "image/webp";
      document.head.appendChild(l);
    })();
  </script>
  <script src="assets/vendor/qrcode.js" defer></script>
  <script src="main.js" defer></script>
</head>
